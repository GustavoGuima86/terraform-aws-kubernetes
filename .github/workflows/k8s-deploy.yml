name: Kubernetes Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_crds:
        description: 'Skip CRDs installation (if already installed)'
        required: false
        default: false
        type: boolean
  # workflow_run:
  #   workflows: ["Terraform Deploy"]
  #   types:
  #     - completed
  #   branches:
  #     - main

env:
  AWS_REGION: 'eu-central-1'
  KUBECTL_VERSION: 'v1.31.0'
  HELM_VERSION: 'v4.1.0'

permissions:
  id-token: write
  contents: read

jobs:
  k8s-deploy:
    name: Deploy Kubernetes Resources
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Kubernetes
      
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
      
      - name: Download Terraform Outputs
        uses: actions/download-artifact@v7
        with:
          name: terraform-outputs
          path: ./
        continue-on-error: true
      
      - name: Get Terraform Outputs from State (fallback)
        if: ${{ !hashFiles('tf_outputs.json') }}
        run: |
          # Initialize Terraform to access state
          cd infrastructure/environments
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          
          # Get outputs and save to file
          terraform output -json > ../../tf_outputs.json
          cd ../..
      
      - name: Parse Terraform Outputs
        id: tf-outputs
        run: |
          if [ ! -f tf_outputs.json ]; then
            echo "Error: tf_outputs.json not found!"
            exit 1
          fi
          
          # Parse and set environment variables
          export EKS_CLUSTER_NAME=$(jq -r '.eks_cluster_name.value' tf_outputs.json)
          export AWS_REGION_OUTPUT=$(jq -r '.aws_region.value' tf_outputs.json)
          export DOMAIN_NAME=$(jq -r '.domain_name.value' tf_outputs.json)
          
          echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME" >> $GITHUB_ENV
          echo "AWS_REGION_OUTPUT=$AWS_REGION_OUTPUT" >> $GITHUB_ENV
          echo "DOMAIN_NAME=$DOMAIN_NAME" >> $GITHUB_ENV
          
          # Export all outputs as JSON for later use
          cat tf_outputs.json
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION_OUTPUT }} \
            --alias ${{ env.EKS_CLUSTER_NAME }}
          
          # Verify connection
          kubectl cluster-info
          kubectl get nodes
      
      - name: Install CRDs
        if: ${{ !github.event.inputs.skip_crds }}
        run: |
          echo "Installing Kubernetes CRDs..."
          chmod +x k8s/crds/install-crds.sh
          ./k8s/crds/install-crds.sh
          
          # Wait for CRDs to be established
          echo "Waiting for CRDs to be ready..."
          sleep 10
          kubectl get crds
      
      - name: Deploy EBS CSI Storage Class
        run: |
          echo "Deploying EBS CSI Storage Class..."
          helm upgrade --install ebs-csi-storage-class k8s/ebs-csi-storage-class \
            --namespace kube-system \
            --create-namespace \
            --wait \
            --timeout 5m
          
          # Verify storage class
          kubectl get storageclass
      
      - name: Deploy ArgoCD Core
        run: |
          echo "Deploying ArgoCD Core..."

          # Generate a values override file so the multiline oidc.config renders
          # correctly with the domain name (--set does not handle multiline YAML).
          cat > /tmp/argocd-oidc-values.yaml << EOF
          argo-cd:
            configs:
              cm:
                url: "https://argocd.${DOMAIN_NAME}"
                oidc.config: |
                  name: Keycloak
                  issuer: https://keycloak.${DOMAIN_NAME}/realms/platform
                  clientID: argocd
                  clientSecret: \$oidc.keycloak.clientSecret
                  requestedScopes:
                    - openid
                    - profile
                    - email
                    - groups
          EOF

          helm upgrade --install argocd-core k8s/argocd-core \
            --namespace argocd \
            --create-namespace \
            --set installCRDs=false \
            --set argo-cd.crds.install=false \
            --set argo-cd.applicationSet.enabled=false \
            --set argo-cd.notifications.enabled=false \
            --set domain_name="$DOMAIN_NAME" \
            --set "argo-cd.configs.secret.extra.oidc\.keycloak\.clientSecret=${{ secrets.KEYCLOAK_ARGOCD_CLIENT_SECRET }}" \
            --values /tmp/argocd-oidc-values.yaml \
            --wait \
            --timeout 10m
          
          # Wait for ArgoCD to be ready
          echo "Waiting for ArgoCD to be ready..."
          kubectl wait --for=condition=available --timeout=300s \
            deployment/argocd-core-server -n argocd
          
          kubectl get pods -n argocd
      
      - name: Prepare ArgoCD Applications Values
        id: prepare-values
        run: |
          # Extract all needed values from Terraform outputs
          cat << 'EOF' > argocd-values.sh
          #!/bin/bash
          set -e
          
          # Read Terraform outputs
          export AWS_ACCOUNT_ID=$(jq -r '.aws_account_id.value' tf_outputs.json)
          export AWS_REGION=$(jq -r '.aws_region.value' tf_outputs.json)
          export DOMAIN_NAME=$(jq -r '.domain_name.value' tf_outputs.json)
          export CERTIFICATE_ARN=$(jq -r '.certificate_arn.value' tf_outputs.json)
          export HOSTED_ZONE_ID=$(jq -r '.hosted_zone_id.value' tf_outputs.json)
          export VPC_ID=$(jq -r '.vpc_id.value' tf_outputs.json)
          export DB_SECRET_ARN=$(jq -r '.db_secret_arn.value' tf_outputs.json)
          export DB_URL=$(jq -r '.db_url.value' tf_outputs.json)
          export DB_PORT=$(jq -r '.db_port.value' tf_outputs.json)
          export EKS_CLUSTER_ENDPOINT=$(jq -r '.eks_cluster_endpoint.value' tf_outputs.json)
          export EKS_CLUSTER_CA=$(jq -r '.eks_cluster_ca_certificate.value' tf_outputs.json)
          export EKS_CLUSTER_NAME=$(jq -r '.eks_cluster_name.value' tf_outputs.json)
          export LOKI_BUCKET=$(jq -r '.loki_bucket_name.value' tf_outputs.json)
          export LOKI_SA=$(jq -r '.loki_service_account_name.value' tf_outputs.json)
          export MIMIR_BUCKET=$(jq -r '.mimir_bucket_name.value' tf_outputs.json)
          export MIMIR_SA=$(jq -r '.mimir_service_account_name.value' tf_outputs.json)
          export VELERO_BUCKET=$(jq -r '.velero_bucket_name.value' tf_outputs.json)
          export VELERO_REGION=$(jq -r '.velero_bucket_region.value' tf_outputs.json)
          export VELERO_SA=$(jq -r '.velero_sa_name.value' tf_outputs.json)
          export FALCO_ROLE_ARN=$(jq -r '.falco_role_arn.value' tf_outputs.json)
          export FALCO_SA=$(jq -r '.falco_sa_name.value' tf_outputs.json)
          export OPENCOST_ROLE_ARN=$(jq -r '.opencost_role_arn.value' tf_outputs.json)
          export OPENCOST_SA=$(jq -r '.opencost_sa_name.value' tf_outputs.json)
          export KARPENTER_NODE_ROLE=$(jq -r '.karpenter_node_iam_role_name.value' tf_outputs.json)
          export KARPENTER_QUEUE=$(jq -r '.karpenter_interruption_queue_name.value' tf_outputs.json)
          export KARPENTER_SA=$(jq -r '.karpenter_sa_name.value' tf_outputs.json)
          export EXTERNAL_DNS_ROLE=$(jq -r '.external_dns_role_arn.value' tf_outputs.json)
          export EXTERNAL_DNS_SA=$(jq -r '.external_dns_sa_name.value' tf_outputs.json)
          export AWS_LB_ROLE=$(jq -r '.aws_lb_controller_role_arn.value' tf_outputs.json)
          export AWS_LB_SA=$(jq -r '.aws_lb_controller_sa_name.value' tf_outputs.json)
          export EBS_CSI_SA=$(jq -r '.ebs_csi_controller_sa_name.value' tf_outputs.json)
          export SECRETS_CSI_SA=$(jq -r '.secrets_csi_driver_sa_name.value' tf_outputs.json)
          
          # Export all as environment variables
          for var in AWS_ACCOUNT_ID AWS_REGION DOMAIN_NAME CERTIFICATE_ARN HOSTED_ZONE_ID \
                     VPC_ID DB_SECRET_ARN DB_URL DB_PORT EKS_CLUSTER_ENDPOINT EKS_CLUSTER_CA \
                     EKS_CLUSTER_NAME LOKI_BUCKET LOKI_SA MIMIR_BUCKET MIMIR_SA VELERO_BUCKET \
                     VELERO_REGION VELERO_SA FALCO_ROLE_ARN FALCO_SA OPENCOST_ROLE_ARN OPENCOST_SA \
                     KARPENTER_NODE_ROLE KARPENTER_QUEUE KARPENTER_SA EXTERNAL_DNS_ROLE \
                     EXTERNAL_DNS_SA AWS_LB_ROLE AWS_LB_SA EBS_CSI_SA SECRETS_CSI_SA; do
            echo "$var=${!var}" >> $GITHUB_ENV
          done
          EOF
          
          chmod +x argocd-values.sh
          ./argocd-values.sh
      
      - name: Deploy ArgoCD Applications
        run: |
          echo "Deploying ArgoCD Applications..."
          
          helm upgrade --install argocd-applications k8s/argocd-applications \
            --namespace argocd \
            --create-namespace \
            --set aws_account_id="$AWS_ACCOUNT_ID" \
            --set aws_region="$AWS_REGION" \
            --set domain_name="$DOMAIN_NAME" \
            --set certificate_arn="$CERTIFICATE_ARN" \
            --set hosted_zone_id="$HOSTED_ZONE_ID" \
            --set vpc_id="$VPC_ID" \
            --set db_secret_arn="$DB_SECRET_ARN" \
            --set db_url="$DB_URL" \
            --set db_port="$DB_PORT" \
            --set eks_cluster_endpoint="$EKS_CLUSTER_ENDPOINT" \
            --set eks_cluster_ca_certificate="$EKS_CLUSTER_CA" \
            --set eks_cluster_name="$EKS_CLUSTER_NAME" \
            --set loki_bucket_name="$LOKI_BUCKET" \
            --set loki_service_account_name="$LOKI_SA" \
            --set mimir_bucket_name="$MIMIR_BUCKET" \
            --set mimir_service_account_name="$MIMIR_SA" \
            --set velero_bucket_name="$VELERO_BUCKET" \
            --set velero_bucket_region="$VELERO_REGION" \
            --set velero_sa_name="$VELERO_SA" \
            --set falco_role_arn="$FALCO_ROLE_ARN" \
            --set falco_sa_name="$FALCO_SA" \
            --set opencost_role_arn="$OPENCOST_ROLE_ARN" \
            --set opencost_sa_name="$OPENCOST_SA" \
            --set karpenter_node_iam_role_name="$KARPENTER_NODE_ROLE" \
            --set karpenter_interruption_queue_name="$KARPENTER_QUEUE" \
            --set karpenter_sa_name="$KARPENTER_SA" \
            --set external_dns_role_arn="$EXTERNAL_DNS_ROLE" \
            --set external_dns_sa_name="$EXTERNAL_DNS_SA" \
            --set aws_lb_controller_role_arn="$AWS_LB_ROLE" \
            --set aws_lb_controller_sa_name="$AWS_LB_SA" \
            --set ebs_csi_controller_sa_name="$EBS_CSI_SA" \
            --set secrets_csi_driver_sa_name="$SECRETS_CSI_SA" \
            --set kube_prometheus_release="kube-prometheus-stack" \
            --set keycloak_admin_password="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set keycloak_argocd_client_secret="${{ secrets.KEYCLOAK_ARGOCD_CLIENT_SECRET }}" \
            --set keycloak_grafana_client_secret="${{ secrets.KEYCLOAK_GRAFANA_CLIENT_SECRET }}" \
            --set keycloak_backstage_client_secret="${{ secrets.KEYCLOAK_BACKSTAGE_CLIENT_SECRET }}" \
            --set gitRepo.url="https://github.com/${{ github.repository }}" \
            --set gitRepo.branch="${{ github.ref_name }}" \
            --wait \
            --timeout 15m
          
          echo "ArgoCD Applications deployed successfully!"
      
      - name: Verify ArgoCD Applications
        run: |
          echo "Verifying ArgoCD Applications..."
          kubectl get applications -n argocd
          kubectl get appprojects -n argocd
          
          # Wait for applications to sync
          echo "Waiting for applications to sync (this may take a few minutes)..."
          sleep 30
          
          # Check application health
          kubectl get applications -n argocd -o wide
      
      - name: Get ArgoCD Admin Password
        id: argocd-password
        run: |
          # Get ArgoCD admin password
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)
          
          echo "::add-mask::$ARGOCD_PASSWORD"
          echo "password=$ARGOCD_PASSWORD" >> $GITHUB_OUTPUT
          
          echo "ArgoCD UI: https://argocd.${{ env.DOMAIN_NAME }}"
          echo "Username: admin"
      
      - name: Create Deployment Summary
        if: always()
        run: |
          echo "## Kubernetes Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **EKS Cluster**: ${{ env.EKS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION_OUTPUT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: ${{ env.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CRDs installed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ EBS CSI Storage Class deployed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ArgoCD Core deployed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ArgoCD Applications deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access Information" >> $GITHUB_STEP_SUMMARY
          echo "- **ArgoCD UI**: https://argocd.${{ env.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Username**: admin" >> $GITHUB_STEP_SUMMARY
          echo "- **Password**: (stored in GitHub Actions secrets)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ArgoCD Applications Status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get applications -n argocd >> $GITHUB_STEP_SUMMARY || echo "Unable to get applications status" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
