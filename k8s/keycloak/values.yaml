# ==============================================================================
# Keycloak Configuration
# ==============================================================================

# Domain configuration (set by ArgoCD)
domain_name: ""

# HTTPRoute configuration
route:
  enabled: true
  hostname: "keycloak.gustavo.inno-on.cloud"
  gateway:
    name: tooling-gateway
    namespace: istio-system
    sectionName: https

# PostgreSQL configuration (CloudNativePG)
postgres:
  enabled: true
  secretName: keycloak-postgres-app
  host: keycloak-postgres-rw.keycloak.svc.cluster.local
  port: 5432
  database: keycloak
  storageClass: gp3-secure
  storageSize: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Keycloak Helm chart values
keycloak:
  replicas: 1

  # Run in production mode behind the Istio gateway (TLS terminated at gateway)
  args:
    - start
    - --hostname-strict=false
    - --http-enabled=true
    - --proxy-headers=xforwarded

  extraEnv: |
    - name: KC_DB
      value: postgres
    - name: KC_DB_URL_HOST
      value: keycloak-postgres-rw.keycloak.svc.cluster.local
    - name: KC_DB_URL_PORT
      value: "5432"
    - name: KC_DB_URL_DATABASE
      value: keycloak
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-postgres-app
          key: username
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-postgres-app
          key: password
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KEYCLOAK_ADMIN
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-secret
          key: username
    - name: KEYCLOAK_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin-secret
          key: password

  service:
    type: ClusterIP
    httpPort: 8080

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

  # Health checks
  health:
    enabled: true

  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
