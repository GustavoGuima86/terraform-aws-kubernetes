# ==============================================================================
# Falco Runtime Security Configuration
# ==============================================================================

# AWS Integration
aws_region: ""
falco_role_arn: ""
falco_sa_name: "falco"

# Istio Ingress (deprecated - use route config below)
domain_name: ""
certificate_arn: ""

# HTTPRoute configuration
route:
  enabled: true
  hostname: "falco.gustavo.inno-on.cloud"
  gateway:
    name: tooling-gateway
    namespace: istio-system
    sectionName: https
  serviceName: falco-falcosidekick-ui
  servicePort: 2802

# Kube Prometheus Stack release name
kube_prometheus_release: "kube-prometheus-stack"

# ==============================================================================
# Falco Configuration
# ==============================================================================
falco:
  enabled: true

  # Use modern eBPF driver for better performance
  driver:
    kind: modern_ebpf

  # Service account for Pod Identity
  # Note: Service account is created via template with Pod Identity annotation
  serviceAccount:
    create: false
    name: falco
    annotations: {}

  # Falco configuration
  falco:
    # Enable JSON output for better parsing
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true

    # Log settings
    log_stderr: true
    log_syslog: false
    log_level: info

    # Performance tuning
    syscall_event_drops:
      actions:
        - log
        - alert
      rate: 0.03333
      max_burst: 1

    # Buffering
    buffered_outputs: true

    # Rules management (using plural form as per Falco 0.34+)
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/falco_rules.local.yaml
      - /etc/falco/rules.d

    # Outputs - send to Falcosidekick
    http_output:
      enabled: true
      url: "http://falcosidekick:2801"

    # Prometheus metrics
    metrics:
      enabled: true
      interval: 1h
      output_rule: true
      rules_counters_enabled: true
      resource_utilization_enabled: true
      state_counters_enabled: true
      kernel_event_counters_enabled: true
      libbpf_stats_enabled: true

  # Custom Falco rules (can be extended)
  customRules:
    rules-eks-security.yaml: |-
      # ==============================================================================
      # EKS-Specific Security Rules
      # ==============================================================================
      
      # ------------------------------------------------------------------------------
      # Shell and Command Execution
      # ------------------------------------------------------------------------------
      
      - rule: Terminal shell in container
        desc: A shell was used as the entrypoint/exec point into a container with an attached terminal.
        condition: >
          spawned_process and container
          and shell_procs and proc.tty != 0
          and container_entrypoint
          and not user_expected_terminal_shell_in_container_conditions
        output: >
          A shell was spawned in a container with an attached terminal (user=%user.name user_loginuid=%user.loginuid %container.info
          shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline terminal=%proc.tty container_id=%container.id image=%container.image.repository)
        priority: NOTICE
        tags: [container, shell, mitre_execution, T1059]

      - rule: Unauthorized Process in Container
        desc: Detect processes not matching the expected container behavior
        condition: >
          spawned_process and container
          and not proc.name in (known_drop_and_execute_containers, user_known_exec_in_container_activities)
          and proc.name in (netcat, ncat, nc, socat, nmap, wget, curl)
        output: >
          Suspicious process started in container (user=%user.name command=%proc.cmdline container=%container.name 
          image=%container.image.repository:%container.image.tag parent=%proc.pname)
        priority: WARNING
        tags: [container, process, mitre_execution, T1059]

      # ------------------------------------------------------------------------------
      # Kubernetes Secret and Credential Access
      # ------------------------------------------------------------------------------
      
      - rule: Kubernetes Secret Access
        desc: Detect access to Kubernetes secrets
        condition: >
          open_read and container and
          fd.name glob /var/run/secrets/kubernetes.io/*
          and not proc.name in (allowed_k8s_secret_readers)
        output: >
          Kubernetes secret accessed (user=%user.name command=%proc.cmdline file=%fd.name %container.info 
          image=%container.image.repository:%container.image.tag)
        priority: WARNING
        tags: [kubernetes, secrets, mitre_credential_access, T1552]

      - rule: Read Sensitive File in Container
        desc: Detect attempts to read sensitive files
        condition: >
          open_read and container and sensitive_files
          and not proc.name in (docker, oci, podman, crio, kubelet)
        output: >
          Sensitive file opened for reading (user=%user.name command=%proc.cmdline file=%fd.name 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: WARNING
        tags: [filesystem, mitre_credential_access, T1552]

      - rule: AWS EC2 Metadata Service Access
        desc: Detect access to EC2 instance metadata service (potential SSRF or credential theft)
        condition: >
          outbound and container
          and fd.sip="169.254.169.254"
          and not proc.name in (aws-node, vpc-cni, amazon-cloudwatch-agent)
        output: >
          Container accessing AWS metadata service (user=%user.name command=%proc.cmdline container=%container.name 
          image=%container.image.repository:%container.image.tag connection=%fd.name)
        priority: WARNING
        tags: [network, aws, mitre_credential_access, T1552.005]

      # ------------------------------------------------------------------------------
      # File System Modifications
      # ------------------------------------------------------------------------------
      
      - rule: Write Below Binary Directory
        desc: Detect writes to binary directories (potential malware installation)
        condition: >
          write_below_binary_dir and not package_mgmt_procs
          and not exe_running_docker_save
          and not python_running_get_pip
          and not known_bin_writers
        output: >
          File written below a known binary directory (user=%user.name command=%proc.cmdline 
          file=%fd.name parent=%proc.pname container=%container.name image=%container.image.repository)
        priority: ERROR
        tags: [filesystem, mitre_persistence, T1543]

      - rule: Write Below Etc Directory
        desc: Detect writes to /etc directory (configuration tampering)
        condition: >
          write_etc_common and not proc.name in (systemd, dbus-daemon, systemd-resolved)
          and not package_mgmt_procs
          and not container_entrypoint
        output: >
          File below /etc written (user=%user.name command=%proc.cmdline file=%fd.name 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: WARNING
        tags: [filesystem, mitre_persistence, T1574]

      - rule: Suspicious File Modification in Container
        desc: Detect modifications to important system files
        condition: >
          modify and container
          and fd.name in (/etc/passwd, /etc/shadow, /etc/sudoers, /etc/ssh/sshd_config)
        output: >
          Critical system file modified in container (user=%user.name command=%proc.cmdline file=%fd.name 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: CRITICAL
        tags: [filesystem, mitre_persistence, T1098]

      # ------------------------------------------------------------------------------
      # Network Security
      # ------------------------------------------------------------------------------
      
      - rule: Outbound Connection to Suspicious Port
        desc: Detect outbound connections to commonly used hacking/backdoor ports
        condition: >
          outbound and container
          and fd.sport in (4444, 5555, 6666, 7777, 8888, 9999, 31337, 12345)
        output: >
          Suspicious outbound connection detected (user=%user.name command=%proc.cmdline 
          connection=%fd.name container=%container.name image=%container.image.repository port=%fd.sport)
        priority: WARNING
        tags: [network, mitre_command_and_control, T1571]

      - rule: Cryptocurrency Mining Activity
        desc: Detect potential cryptocurrency mining in containers
        condition: >
          spawned_process and container
          and (proc.name in (xmrig, minerd, cpuminer, ethminer, cryptonight) or
               proc.cmdline contains "stratum+tcp" or
               proc.cmdline contains "cryptonight" or
               proc.cmdline contains "nicehash")
        output: >
          Potential cryptocurrency mining detected (user=%user.name command=%proc.cmdline 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: CRITICAL
        tags: [process, mitre_impact, T1496]

      - rule: Reverse Shell Activity
        desc: Detect reverse shell attempts
        condition: >
          spawned_process and container
          and ((proc.name = "bash" and proc.cmdline contains "dev/tcp") or
               (proc.name in (nc, ncat, netcat, socat) and (proc.cmdline contains "-e" or proc.cmdline contains "-c")) or
               (proc.cmdline contains "/bin/sh" and proc.cmdline contains "-i"))
        output: >
          Reverse shell activity detected (user=%user.name command=%proc.cmdline 
          container=%container.name image=%container.image.repository:%container.image.tag parent=%proc.pname)
        priority: CRITICAL
        tags: [network, shell, mitre_execution, T1059]

      # ------------------------------------------------------------------------------
      # Privilege Escalation
      # ------------------------------------------------------------------------------
      
      - rule: Set Setuid or Setgid Bit
        desc: Detect setting setuid/setgid bits (privilege escalation technique)
        condition: >
          chmod and (evt.arg.mode contains "S_ISUID" or evt.arg.mode contains "S_ISGID")
          and not proc.name in (dpkg, rpm, yum, apt, apt-get)
        output: >
          Setuid or setgid bit set via chmod (user=%user.name command=%proc.cmdline file=%evt.arg.filename 
          mode=%evt.arg.mode container=%container.name)
        priority: WARNING
        tags: [filesystem, mitre_privilege_escalation, T1548.001]

      - rule: Sudo Command Execution
        desc: Detect sudo command usage in containers
        condition: >
          spawned_process and container
          and proc.name = "sudo"
        output: >
          Sudo command executed in container (user=%user.name command=%proc.cmdline 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: NOTICE
        tags: [process, mitre_privilege_escalation, T1548.003]

      # ------------------------------------------------------------------------------
      # Container Security Best Practices
      # ------------------------------------------------------------------------------
      
      - rule: Container Run as Root User
        desc: Detect containers running as root (violates security best practice)
        condition: >
          container_started and container
          and user.uid = 0
          and not user_known_privileged_containers
        output: >
          Container started as root user (user=%user.name container=%container.name 
          image=%container.image.repository:%container.image.tag)
        priority: WARNING
        tags: [container, mitre_privilege_escalation, T1611]

      - rule: Package Management Process Launched in Container
        desc: Detect package manager usage in running containers (potential supply chain attack)
        condition: >
          spawned_process and container
          and package_mgmt_procs
          and not package_mgmt_ancestor_procs
          and not user_known_package_manager_in_container
        output: >
          Package manager process launched in container (user=%user.name command=%proc.cmdline 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: WARNING
        tags: [process, mitre_persistence, T1505]

      # ------------------------------------------------------------------------------
      # Kubernetes-Specific Threats
      # ------------------------------------------------------------------------------
      
      - rule: K8s Service Account Token Access
        desc: Detect reading of service account token from container
        condition: >
          open_read and container
          and fd.name = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          and not proc.name in (kubectl, kubelet, kube-proxy)
        output: >
          Service account token accessed (user=%user.name command=%proc.cmdline 
          container=%container.name image=%container.image.repository:%container.image.tag file=%fd.name)
        priority: WARNING
        tags: [kubernetes, mitre_credential_access, T1528]

      - rule: Kubectl Execution in Container
        desc: Detect kubectl command execution (potential cluster access)
        condition: >
          spawned_process and container
          and proc.name = "kubectl"
        output: >
          Kubectl executed in container (user=%user.name command=%proc.cmdline 
          container=%container.name image=%container.image.repository:%container.image.tag)
        priority: NOTICE
        tags: [kubernetes, process, mitre_discovery, T1613]

      # ------------------------------------------------------------------------------
      # Macros for Allowed/Expected Behavior (customize per environment)
      # ------------------------------------------------------------------------------
      
      - macro: allowed_k8s_secret_readers
        condition: (proc.name in (nginx, envoy, aws-node, kube-proxy, fluentd, fluent-bit))

      - macro: user_expected_terminal_shell_in_container_conditions
        condition: (never_true)

      - macro: user_known_privileged_containers
        condition: (container.image.repository in (falco, falcosidekick, aws-node, kube-proxy, calico-node))

      - macro: user_known_package_manager_in_container
        condition: (container.image.repository startswith "build" or container.image.repository contains "jenkins")

      - macro: user_known_exec_in_container_activities
        condition: (never_true)

      - macro: known_bin_writers
        condition: (proc.name in (node, python, ruby, java))

  # Resource limits
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 512Mi

  # Tolerations to run on all nodes
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane

  # Host namespace access (required for runtime security)
  hostNetwork: false

  # Priority class
  priorityClassName: system-node-critical

  # Metrics service for Prometheus
  services:
    - name: metrics
      type: ClusterIP
      ports:
        - name: metrics
          port: 8765
          targetPort: 8765
          protocol: TCP

# ==============================================================================
# Falcosidekick Configuration (Alert Forwarding + UI)
# ==============================================================================
falcosidekick:
  enabled: true

  # Service account for Pod Identity (if needed for AWS services)
  serviceAccount:
    create: false
    name: falcosidekick
    annotations: {}

  # Replicas for HA
  replicaCount: 2

  # Web UI for viewing Falco events
  webui:
    enabled: true
    replicaCount: 1

    service:
      type: ClusterIP
      port: 2802

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  config:
    # Enable debug for initial setup
    debug: false

    # CloudWatch integration (optional - configure if needed)
    aws:
      # Enable CloudWatch Logs
      cloudwatchlogs:
        loggroup: ""  # Set to enable: "/aws/eks/falco"
        logstream: ""  # Set to enable: "falco-events"
        minimumpriority: "warning"

      # Enable SNS notifications (optional)
      sns:
        topicarn: ""  # Set ARN to enable SNS notifications
        rawjson: true
        minimumpriority: "warning"

      # Enable SQS (optional)
      sqs:
        url: ""  # Set URL to enable SQS
        minimumpriority: "warning"

    # Slack integration (optional)
    slack:
      webhookurl: ""  # Add Slack webhook URL if desired
      minimumpriority: "warning"

    # Loki integration for log aggregation
    loki:
      hostport: ""  # e.g., "http://loki-gateway.observability.svc.cluster.local:80"
      minimumpriority: "debug"
      mutualtls: false
      checkcert: false

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

