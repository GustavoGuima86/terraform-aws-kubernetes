{{- if and .Values.domain_name .Values.falcosidekick.webui.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-ui-route
  namespace: {{ .Release.Namespace }}
  labels:
    app: falco-ui
    gateway: istio-gateway
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-443
  hostnames:
    - "falco.{{ .Values.domain_name }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: falcosidekick-ui
          port: 2802
          weight: 100
{{- end }}
