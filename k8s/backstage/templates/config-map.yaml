apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      baseUrl: ${APP_BASE_URL}
    backend:
      baseUrl: ${BACKEND_BASE_URL}
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DB}
          ssl: false
        # Connection pool settings
        pool:
          min: 2
          max: 10
          acquireTimeoutMillis: 60000
          idleTimeoutMillis: 30000
        # Use a single database with schemas per plugin (not separate databases)
        # The app user cannot create databases, only schemas
        pluginDivisionMode: schema

    # Keycloak OIDC authentication
    # Requires @backstage/plugin-auth-backend-module-oidc-provider installed in the app
    auth:
      environment: production
      session:
        secret: ${BACKEND_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: ${KEYCLOAK_REALM_URL}/.well-known/openid-configuration
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            callbackUrl: ${APP_BASE_URL}/api/auth/oidc/handler/frame
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail
                - resolver: emailLocalPartMatchingUserEntityName