---
# CloudNativePG Cluster for Backstage
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  # Single instance for Backstage (can be increased to 3 for HA)
  instances: 1

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:15.5

  # Storage configuration
  storage:
    size: 20Gi
    storageClass: gp3

  # PostgreSQL configuration parameters
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "2GB"

  # Bootstrap configuration - initialize database
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
      secret:
        name: backstage-postgres-app-user

  # Monitoring configuration
  monitoring:
    enablePodMonitor: true

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Service configuration
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: backstage-postgres
            spec:
              type: ClusterIP
              ports:
                - protocol: TCP
                  port: 5432
                  targetPort: 5432

---
# Secret for Backstage database user
# CloudNativePG will populate the password automatically
apiVersion: v1
kind: Secret
metadata:
  name: backstage-postgres-app-user
  namespace: backstage
type: kubernetes.io/basic-auth
stringData:
  username: backstage
  password: ""  # Will be auto-generated by CloudNativePG
