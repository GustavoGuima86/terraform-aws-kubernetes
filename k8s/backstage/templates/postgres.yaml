---
# CloudNativePG Cluster for Backstage
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  # Single instance for Backstage (can be increased to 3 for HA)
  instances: 1

  # PostgreSQL version
  imageName: ghcr.io/cloudnative-pg/postgresql:15.5

  # Storage configuration
  storage:
    size: 20Gi
    storageClass: gp3

  # PostgreSQL configuration parameters
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "2GB"
      # Listen on all interfaces for in-cluster connections
      listen_addresses: "*"

  # Bootstrap configuration - initialize database
  # CloudNativePG will auto-create:
  # - Database: app
  # - User: app
  # - Secret: backstage-postgres-app (with username, password, dbname, host, port)
  bootstrap:
    initdb:
      database: app
      owner: app

  # Monitoring configuration
  monitoring:
    enablePodMonitor: true

  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

---
# No need for manual secret - CloudNativePG auto-generates it
# The secret will be named: backstage-postgres-app-user
