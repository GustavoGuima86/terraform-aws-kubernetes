apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-store-csi-provider-aws-network-policy
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: csi-secrets-store-provider-aws
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow access from secrets-store-csi-driver
    - from:
        - podSelector:
            matchLabels:
              app: secrets-store-csi-driver
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow HTTPS egress for AWS Secrets Manager
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
