# holmes-values.yaml

holmes:
  modelList:
    llama3:
      model: "ollama/qwen2.5:3b"
      type: "ollama"
      base_url: "http://ollama.ai-sre.svc.cluster.local:11434"
      temperature: 0.5
      is_default: true
  createServiceAccount: true
  customServiceAccountName: holmes
  customClusterRoleRules:
    - apiGroups: ["*"]
      resources: ["*"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods/log"]
      verbs: ["get"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
