apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt
  namespace: ai-sre
spec:
  ai:
    enabled: true
    model: ollama
    backend: llama3
    baseUrl: http://ollama.ollama.svc.cluster.local:11434
  noCache: false
  filters:
    - Pod
    - Deployment
    - Service
    - Ingress
  version: v0.3.41
