# values-ollama.yaml
ollama:
  gpu:
    enabled: false
  models:
    - name: qwen2.5:3b

  env:
    OLLAMA_NUM_CTX: "32768"
    OLLAMA_KEEP_ALIVE: "24h"

  lifecycle:
    postStart:
      exec:
        command:
          - "/bin/sh"
          - "-c"
          - "nohup sh -c 'sleep 50; ollama pull qwen2.5:3b' > /tmp/pull.log 2>&1 &"

service:
  type: ClusterIP
  port: 11434

persistentVolume:
  enabled: true
  size: 30Gi
  storageClass: "gp3-secure"