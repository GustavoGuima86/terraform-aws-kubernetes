# values-ollama.yaml
ollama:
  gpu:
    enabled: false
  models:
    - name: llama3

  lifecycle:
    postStart:
      exec:
        command:
          - "/bin/sh"
          - "-c"
          - "nohup sh -c 'sleep 10; ollama pull llama3' > /tmp/pull.log 2>&1 &"

service:
  type: ClusterIP
  port: 11434

persistentVolume:
  enabled: true
  size: 10Gi