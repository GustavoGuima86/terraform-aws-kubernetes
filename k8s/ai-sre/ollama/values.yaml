# values-ollama.yaml
# All values must be nested under 'ollama' because that's the dependency chart name
ollama:
  ollama:
    gpu:
      enabled: false

    models:
      pull:
        - llama3.1

  # Environment variables for Ollama
  extraEnv:
    - name: OLLAMA_NUM_CTX
      value: "32768"
    - name: OLLAMA_KEEP_ALIVE
      value: "24h"

  # Pod resource requests and limits
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
    limits:
      cpu: "8"
      memory: "32Gi"

  # Persistent volume configuration
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: "gp3-secure"
    accessModes:
      - ReadWriteOnce
