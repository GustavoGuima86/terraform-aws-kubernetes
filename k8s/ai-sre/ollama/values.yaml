# values-ollama.yaml
ollama:
  gpu:
    enabled: false

  # Use the built-in model pulling feature from the chart
  models:
    pull:
      - devstral-small-2:latest

  env:
    OLLAMA_NUM_CTX: "8192"
    OLLAMA_KEEP_ALIVE: "24h"

resources:
  requests:
    cpu: "4"
    memory: "16Gi"
  limits:
    cpu: "4"
    memory: "32Gi"

persistentVolume:
  enabled: true
  size: 50Gi
  storageClass: "gp3-secure"
  accessModes:
    - ReadWriteOnce
