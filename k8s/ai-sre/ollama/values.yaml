# values-ollama.yaml
ollama:
  gpu:
    enabled: false
  models:
    pull:
      - llama3.1
  extraEnv:
    - name: OLLAMA_NUM_CTX
      value: "32768"
    - name: OLLAMA_KEEP_ALIVE
      value: "24h"
  resources:
    requests:
      cpu: "8"
      memory: "32Gi"
    limits:
      cpu: "8"
      memory: "32Gi"
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: "gp3-secure"
    accessModes:
      - ReadWriteOnce
