# values-ollama.yaml
ollama:
  gpu:
    enabled: false
  models:
    - name: devstral-small-2:latest

  env:
    OLLAMA_NUM_CTX: "384000"
    OLLAMA_KEEP_ALIVE: "24h"

  lifecycle:
    postStart:
      exec:
        command:
          - "/bin/sh"
          - "-c"
          - |
            nohup sh -c '
            LOG="/tmp/pull.log"
            MODEL="devstral-small-2:latest"
            echo "$(date): Script started." > $LOG
            
            # 1. Wait for Ollama to accept connections
            echo "$(date): Waiting for Ollama API..." >> $LOG
            until ollama list > /dev/null 2>&1; do
              sleep 5
            done
            
            # 2. Check if model already exists (skip download if persistent volume worked)
            if ollama list | grep -q "$MODEL"; then
               echo "$(date): Model $MODEL already exists. Skipping." >> $LOG
               exit 0
            fi
            
            # 3. Pull with Retry Loop (5 attempts)
            echo "$(date): Pulling $MODEL..." >> $LOG
            n=0
            until [ "$n" -ge 5 ]; do
               if ollama pull "$MODEL"; then
                  echo "$(date): SUCCESS! Download complete." >> $LOG
                  ollama list >> $LOG
                  break
               else
                  n=$((n+1))
                  echo "$(date): Download failed. Retry $n/5 in 10s..." >> $LOG
                  sleep 10
               fi
            done
            
            if [ "$n" -ge 5 ]; then
               echo "$(date): FAILED after 5 attempts." >> $LOG
            fi
            ' > /dev/null 2>&1 &

  resources:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "4"
      memory: "32Gi"

service:
  type: ClusterIP
  port: 11434

persistence:
  enabled: true
  existingClaim: "manual-ollama-pvc"   # <--- This links the Pod to your PVC
  mountPath: "/root/.ollama"

# Disable the conflicting section if it still exists in your file:
persistentVolume:
  enabled: false