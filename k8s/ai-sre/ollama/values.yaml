# values-ollama.yaml
ollama:
  gpu:
    enabled: false
  models:
    pull:
      - qwen2.5:32b
  extraEnv:
    - name: OLLAMA_NUM_CTX
      value: "65536"
    - name: OLLAMA_KEEP_ALIVE
      value: "24h"
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
  resources:
    requests:
      cpu: "12"
      memory: "40Gi"
    limits:
      cpu: "14"
      memory: "58Gi"
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: "gp3-secure"
    accessModes:
      - ReadWriteOnce
