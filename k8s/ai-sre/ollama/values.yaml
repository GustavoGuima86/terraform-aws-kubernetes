# values-ollama.yaml
ollama:
  gpu:
    enabled: false
  models:
    pull:
      - qwen2.5:14b
  extraEnv:
    # 1. Force the model to stay in RAM forever
    - name: OLLAMA_KEEP_ALIVE
      value: "-1"

    # 2. Enable Flash Attention (Great for m6g instances)
    - name: OLLAMA_FLASH_ATTENTION
      value: "1"

    # 3. Increase CPU parallelism for prompt processing
    - name: OLLAMA_NUM_PARALLEL
      value: "4"

    # 4. Context Window (Keep it large, but 14B processes it faster)
    - name: OLLAMA_NUM_CTX
      value: "32768"
  resources:
    requests:
      cpu: "12"
      memory: "40Gi"
    limits:
      cpu: "14"
      memory: "58Gi"
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: "gp3-secure"
    accessModes:
      - ReadWriteOnce
