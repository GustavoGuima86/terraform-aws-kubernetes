apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-ui
  namespace: ai-sre
  labels:
    app: ollama-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-ui
  template:
    metadata:
      labels:
        app: ollama-ui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            # Connects to your existing internal Ollama service
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ai-sre.svc.cluster.local:11434"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"