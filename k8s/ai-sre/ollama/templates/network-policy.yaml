apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-network-policy
  namespace: ai-sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Kagent
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kagent
      ports:
        - protocol: TCP
          port: 11434
    
    # Allow ingress from Istio gateway (if direct access needed)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 11434
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow HTTPS egress for model downloads
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
