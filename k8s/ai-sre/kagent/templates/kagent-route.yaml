apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: tooling-gateway
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kagent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ .Release.Name }}-ui
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_next   # Next.js scripts
        - path:
            type: PathPrefix
            value: /static  # Static images/css
        - path:
            type: PathPrefix
            value: /api     # Backend API calls
        - path:
            type: PathPrefix
            value: /assets  # Common asset folder
        - path:
            type: PathPrefix
            value: /favicon.ico
        - path:
            type: PathPrefix
            value: /models
        - path:
            type: PathPrefix
            value: /tools
        - path:
            type: PathPrefix
            value: /servers
        - path:
            type: PathPrefix
            value: /agents/ai-sre/k8s-agent/chat
      backendRefs:
        - name: {{ .Release.Name }}-ui
          port: 8080