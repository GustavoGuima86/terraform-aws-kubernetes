kagent:
  # Configure providers
  providers:
    default: ollama
    ollama:
      provider: Ollama
      model: "ollama/qwen2.5:3b"
      config:
        host: "http://ollama-ollama-server.ai-sre.svc.cluster.local:11434"

  # Disable most agents for a minimal setup
  agents:
    k8s-agent:
      enabled: true
    kgateway-agent:
      enabled: false
    istio-agent:
      enabled: false
    promql-agent:
      enabled: false
    observability-agent:
      enabled: false
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false

  # Disable tools
  tools:
    grafana-mcp:
      enabled: false
    querydoc:
      enabled: false
  kagent-tools:
    enabled: true
  kmcp:
    enabled: false

  ui:
    env:
      - name: BASE_URL
        value: "/kagent"
      - name: PUBLIC_URL
        value: "/kagent"
      - name: ROOT_PATH
        value: "/kagent"
      - name: VITE_BASE_PATH
        value: "/kagent"
      # Sometimes "dashboard" is used instead of "ui"

    # Keep this just in case the backend also needs to know its path
  controller:
    env:
      - name: BASE_URL
        value: "/kagent"

# Values for the VirtualService
cluster:
  host: my-cluster.example.com
