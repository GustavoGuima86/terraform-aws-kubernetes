# ==============================================================================
# ArgoCD Core Configuration
# ==============================================================================

# Keycloak domain (set by ArgoCD helm parameters)
keycloak_domain: ""
domain_name: ""

argo-cd:
  global:
    image:
      tag: "v2.12.3"
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
        effect: "NoSchedule"

  # Core installation mode often implies not installing the heavy UI components,
  # but standard Argo CD charts usually install everything unless disabled.
  # For "Core" specifically, people often just want the controller and repo server,
  # but here we keep the standard components enabled based on your snippet.

  installCRDs: false

  server:
    service:
      type: ClusterIP
    ingress:
      enabled: false
    extraArgs:
      - --insecure # Allowing unsecure just for test, when domain is available remove it

  # ============================================================================
  # ArgoCD OIDC Configuration (Keycloak)
  # The full oidc.config and url are injected by the CI pipeline via a generated
  # --values file (argocd-oidc-values.yaml) so that Helm templating can render
  # the domain name into the multiline YAML string correctly.
  # ============================================================================
  configs:
    cm: {}  # url and oidc.config are set by CI --values file
    params:
      server.insecure: true
    secret:
      extra:
        # Overridden at deploy time by: --set "argo-cd.configs.secret.extra.oidc\.keycloak\.clientSecret=<value>"
        "oidc.keycloak.clientSecret": ""
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, /argocd-admins, role:admin

  repoServer:
    serviceAccount:
      create: true

  # Disable components not needed for this specific setup
  applicationSet:
    enabled: false

  controller:
    argocdProject:
      create: false

  # Prevent conflicts if you are managing resources via GitOps later
  createClusterResources: false

  notifications:
    enabled: false