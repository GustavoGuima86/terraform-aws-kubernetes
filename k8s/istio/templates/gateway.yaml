# --- The Gateway (Load Balancer) ---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tooling-gateway
  namespace: istio-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "{{ .Values.rootDomain }}" # gustavo.inno-on.cloud
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All


