# ArgoCD Applications Configuration with Deployment Waves

deploymentMethod: "gitops" # Can be 'gitops' or 'local'

argocdNamespace: "argocd" # Can be overridden via --set flags

gitRepo:
  url: ""
  branch: ""

# Values from Terraform outputs (set via --set flags in helm upgrade)

dbPort: ""
dbSecretArn: ""
dbUrl: ""

eksClusterEndpoint: ""
eksClusterCaCertificate: ""
eksClusterName: ""

lokiBucketName: ""
mimirBucketName: ""
awsRegion: ""
vpcId: ""
veleroBucketName: ""
veleroBucketRegion: ""

# Karpenter values
karpenterNodeIamRoleName: ""
karpenterInterruptionQueueName: ""

# External DNS values
externalDnsRoleArn: ""

# DNS and Certificate values
acmCertificateArn: ""
argocdDomainName: ""
domainName: ""
hostedZoneId: ""
awsAccountId: ""

# Observability values
lokiServiceAccountName: ""
mimirServiceAccountName: ""
kubePrometheusRelease: "kube-prometheus-stack"

# Grafana values

# CloudNativePG values
cloudnativePgEnabled: true

# ==============================================================================

# ArgoCD Projects
# ==============================================================================
# Projects are used to segregate applications and restrict permissions.
# The 'argocd-admin' project is created by Terraform for bootstrapping.
# The projects defined here are created by the 'wave-0-system' ArgoCD app.
# ==============================================================================
argocdProjects:
# Added a comment to force ArgoCD sync
  - name: infrastructure
    description: "Project for core infrastructure components like Karpenter"
    sourceRepos:
      - "https://github.com/GustavoGuima86/terraform-aws-kubernetes"
    destinations:
      - namespace: "karpenter"
        server: "https://kubernetes.default.svc"
      - namespace: "kube-system"
        server: "https://kubernetes.default.svc"
      - namespace: "gatekeeper-system"
        server: "https://kubernetes.default.svc"
      - namespace: "istio-system"
        server: "https://kubernetes.default.svc"
      - namespace: "cnpg-system"
        server: "https://kubernetes.default.svc"
      - namespace: "external-dns"
        server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: observability
    description: "Project for the observability stack (Loki, Mimir, etc.)"
    sourceRepos:
      - "https://github.com/GustavoGuima86/terraform-aws-kubernetes"
    destinations:
      - namespace: "observability"
        server: "https://kubernetes.default.svc"
      - namespace: "kube-system"
        server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: ai-sre
    description: "Project for AI/SRE tools"
    sourceRepos:
      - "https://github.com/GustavoGuima86/terraform-aws-kubernetes"
    destinations:
      - namespace: "ai-sre"
        server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"

  - name: business-applications
    description: "Project for all business-related applications"
    sourceRepos:
      - "*" # Allow applications from any repository
    destinations:
      - namespace: "business-apps"
        server: "https://kubernetes.default.svc"
      - namespace: "backstage"
        server: "https://kubernetes.default.svc"
    clusterResourceWhitelist:
      - group: "argoproj.io"
        kind: "Application"
      - group: ""
        kind: "Service"
      - group: "apps"
        kind: "Deployment"
      - group: "networking.k8s.io"
        kind: "Ingress"

# ArgoCD Route for OpenShift
argocdRoute:
  enabled: false
