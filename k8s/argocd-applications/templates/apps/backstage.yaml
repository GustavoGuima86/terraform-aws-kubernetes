apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: business-applications
  source:
    repoURL: {{ .Values.gitRepo.url }}
    targetRevision: {{ .Values.gitRepo.branch }}
    path: k8s/backstage
    helm:
      valueFiles:
        - values.yaml
      parameters:
        # AWS Configuration
        - name: awsAccountId
          value: "{{ .Values.aws_account_id }}"
        - name: secrets.awsRegion
          value: "{{ .Values.aws_region }}"
        # Route/Domain Configuration
        - name: route.hostname
          value: "backstage.{{ .Values.domain_name }}"
        - name: secrets.appBaseUrl
          value: "https://backstage.{{ .Values.domain_name }}"
        - name: secrets.backendBaseUrl
          value: "https://backstage.{{ .Values.domain_name }}/api"
        # PostgreSQL Configuration (CloudNativePG)
        - name: postgres.host
          value: "backstage-postgres-rw.backstage.svc.cluster.local"
        - name: postgres.port
          value: "5432"
        - name: postgres.database
          value: "backstage"
        - name: postgres.secretName
          value: "backstage-postgres-app-user"
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

