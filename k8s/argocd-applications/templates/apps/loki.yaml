apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability
  source:
    repoURL: https://github.com/GustavoGuima86/terraform-aws-kubernetes
    targetRevision: new-2026-features
    path: k8s/observability/loki
    helm:
      valueFiles:
        - values.yaml
      parameters:
      - name: loki.storage_config.aws.region
        value: "{{ .Values.awsRegion }}"
      - name: loki.storage_config.aws.bucketnames
        value: "{{ .Values.lokiBucketName }}"
      - name: loki.storage.bucketNames.chunks
        value: "{{ .Values.lokiBucketName }}"
      - name: loki.storage.bucketNames.ruler
        value: "{{ .Values.lokiBucketName }}"
      - name: loki.storage.s3.region
        value: "{{ .Values.awsRegion }}"
      - name: serviceAccount.name
        value: "{{ .Values.lokiServiceAccountName }}"
      - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
        value: "{{ .Values.lokiServiceAccountRoleArn }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
