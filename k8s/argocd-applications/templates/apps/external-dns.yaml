apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: {{ .Values.gitRepo.url }}
    targetRevision: {{ .Values.gitRepo.branch }}
    path: k8s/external-dns
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: external-dns.aws.region
          value: "{{ .Values.aws_region }}"
        - name: external-dns.domainFilters[0]
          value: "{{ .Values.domain_name }}"
        - name: external-dns.serviceAccount.name
          value: "{{ .Values.external_dns_sa_name }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

