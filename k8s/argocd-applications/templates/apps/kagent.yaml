apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | default .argocd.app.source.repoURL }} # More robust repoURL
    targetRevision: HEAD
    path: k8s/ai-sre/kagent
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-sre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
