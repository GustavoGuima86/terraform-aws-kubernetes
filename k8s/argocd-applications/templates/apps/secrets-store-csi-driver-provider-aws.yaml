apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-csi-driver-provider-aws
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1" # Deploy after the core CSI driver
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/GustavoGuima86/terraform-aws-kubernetes
    targetRevision: new-2026-features
    path: k8s/secrets-store-csi-driver-provider-aws
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # The provider should be in the same namespace as the core driver
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    ignoreDifferences:
    - group: storage.k8s.io
      kind: CSIDriver
      name: secrets-store.csi.k8s.io
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: secretproviderclasses-admin-role
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: secretproviderclasses-role
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: secretproviderclasses-viewer-role
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: secretproviderclasses-rolebinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: secretproviderclasses.secrets-store.csi.x-k8s.io
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: secretproviderclasspodstatuses.secrets-store.csi.x-k8s.io
