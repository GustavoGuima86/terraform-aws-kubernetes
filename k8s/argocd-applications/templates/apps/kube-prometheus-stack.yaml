apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability
  source:
    repoURL: {{ .Values.gitRepo.url }}
    targetRevision: {{ .Values.gitRepo.branch }}
    path: k8s/observability/prometheus
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: "kube-prometheus-stack.grafana.additionalDataSources[0].url"
          value: "http://loki-gateway.observability.svc:80"
        - name: "kube-prometheus-stack.grafana.additionalDataSources[1].url"
          value: "http://mimir-query-frontend.observability.svc:8080/prometheus"
        - name: "kube-prometheus-stack.prometheus.prometheusSpec.remoteWrite[0].url"
          value: "http://mimir-distributor.observability.svc:8080/api/v1/push"
        - name: "kube-prometheus-stack.prometheus.prometheusSpec.externalLabels.cluster"
          value: "{{ .Values.eks_cluster_name }}"
        - name: "kube-prometheus-stack.clusterName"
          value: "{{ .Values.eks_cluster_name }}"
        - name: "kube-prometheus-stack.awsRegion"
          value: "{{ .Values.aws_region }}"
        - name: "clusterName"
          value: "{{ .Values.eks_cluster_name }}"
        - name: "awsRegion"
          value: "{{ .Values.aws_region }}"
        # Grafana route
        - name: "route.hostname"
          value: "grafana.{{ .Values.domain_name }}"
        # Grafana Keycloak OIDC SSO
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.server.root_url"
          value: "https://grafana.{{ .Values.domain_name }}"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.enabled"
          value: "true"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.name"
          value: "Keycloak"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.allow_sign_up"
          value: "true"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.client_id"
          value: "grafana"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.client_secret"
          value: "{{ .Values.keycloak_grafana_client_secret }}"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.scopes"
          value: "openid profile email groups"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.auth_url"
          value: "https://keycloak.{{ .Values.domain_name }}/realms/platform/protocol/openid-connect/auth"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.token_url"
          value: "https://keycloak.{{ .Values.domain_name }}/realms/platform/protocol/openid-connect/token"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.api_url"
          value: "https://keycloak.{{ .Values.domain_name }}/realms/platform/protocol/openid-connect/userinfo"
        - name: "kube-prometheus-stack.grafana.grafana\\.ini.auth\\.generic_oauth.role_attribute_path"
          value: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'"


  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
