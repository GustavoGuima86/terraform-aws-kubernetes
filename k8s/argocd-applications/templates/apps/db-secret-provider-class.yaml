apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-secret-provider-class
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: {{ .Values.gitRepo.url }}
    targetRevision: {{ .Values.gitRepo.branch }}
    path: k8s/business-apps-config/secrets
    helm:
      parameters:
      - name: dbSecretArn
        value: "{{ .Values.dbSecretArn }}"
      - name: awsRegion
        value: "{{ .Values.awsRegion }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
