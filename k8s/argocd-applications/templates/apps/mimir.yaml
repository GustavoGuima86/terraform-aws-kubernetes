apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: observability
  source:
    repoURL: https://github.com/GustavoGuima86/terraform-aws-kubernetes
    targetRevision: new-2026-features
    path: k8s/observability/mimir
    helm:
      valueFiles:
        - values.yaml
      values: |
        awsRegion: "{{ .Values.awsRegion }}"
        clusterName: "{{ .Values.eksClusterName }}"
        mimir-distributed:
          mimir:
            structuredConfig:
              alertmanager_storage:
                s3:
                  bucket_name: "{{ .Values.mimirBucketName }}"
                  endpoint: s3.{{ .Values.awsRegion }}.amazonaws.com
              blocks_storage:
                s3:
                  bucket_name: "{{ .Values.mimirBucketName }}"
                  endpoint: s3.{{ .Values.awsRegion }}.amazonaws.com
              ruler_storage:
                s3:
                  bucket_name: "{{ .Values.mimirBucketName }}"
                  endpoint: s3.{{ .Values.awsRegion }}.amazonaws.com
          serviceAccount:
            create: true
            annotations:
              eks.amazonaws.com/role-arn: "{{ .Values.mimirServiceAccountRoleArn }}"
          metaMonitoring:
            serviceMonitor:
              labels:
                release: "{{ .Values.kubePrometheusRelease }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
