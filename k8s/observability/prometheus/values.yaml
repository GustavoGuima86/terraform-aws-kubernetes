kube-prometheus-stack:
  grafana:
    replicas: 1
    ingress:
      enabled: false
    additionalDataSources:
      - name: Loki
        type: loki
        isDefault: false
        editable: true
        access: proxy
        url: "" # Set by ArgoCD
        jsonData:
          timeout: 60
          maxLines: 1000
        version: 1
      - name: Mimir
        type: prometheus
        isDefault: false
        editable: true
        access: proxy
        url: "" # Set by ArgoCD
        jsonData:
          timeout: 60
        version: 1

    # Import community dashboards
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: 'istio'
          orgId: 1
          folder: 'Istio'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/istio
        - name: 'karpenter'
          orgId: 1
          folder: 'Karpenter'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/karpenter
        - name: 'argocd'
          orgId: 1
          folder: 'ArgoCD'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/argocd
        - name: 'velero'
          orgId: 1
          folder: 'Velero'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/velero
        - name: 'falco'
          orgId: 1
          folder: 'Falco'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/falco

    dashboards:
      istio:
        # Official Istio dashboards
        istio-control-plane:
          gnetId: 7645
          revision: 203
          datasource: Prometheus
        istio-mesh:
          gnetId: 7639
          revision: 203
          datasource: Prometheus
        istio-service:
          gnetId: 7636
          revision: 203
          datasource: Prometheus
        istio-workload:
          gnetId: 7630
          revision: 203
          datasource: Prometheus
        istio-performance:
          gnetId: 11829
          revision: 203
          datasource: Prometheus

      karpenter:
        # Karpenter dashboard
        karpenter-capacity:
          gnetId: 20449
          revision: 1
          datasource: Prometheus
        karpenter-performance:
          gnetId: 20726
          revision: 1
          datasource: Prometheus

      argocd:
        # ArgoCD operational dashboard
        argocd-operational:
          gnetId: 14584
          revision: 1
          datasource: Prometheus
        argocd-notifications:
          gnetId: 19974
          revision: 1
          datasource: Prometheus

      velero:
        # Velero dashboard
        velero-stats:
          gnetId: 11055
          revision: 2
          datasource: Prometheus

      falco:
        # Falco security dashboard
        falco-dashboard:
          gnetId: 11914
          revision: 1
          datasource: Prometheus

      default:
        # AWS VPC CNI dashboard
        aws-cni-metrics:
          gnetId: 12548
          revision: 1
          datasource: Prometheus
        # Gatekeeper dashboard
        gatekeeper:
          gnetId: 15243
          revision: 1
          datasource: Prometheus

  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: "" # Set by ArgoCD
      externalLabels:
        cluster: "" # Set by ArgoCD
      nodeSelector: {}
      affinity: {}

      # Enable ServiceMonitor discovery for all services
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      # Additional scrape configs for specific services
      additionalScrapeConfigs:
        # Istio control plane metrics
        - job_name: 'istiod'
          kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
              - istio-system
          relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: istiod;http-monitoring

        # Istio envoy sidecars
        - job_name: 'envoy-stats'
          metrics_path: /stats/prometheus
          kubernetes_sd_configs:
          - role: pod
          relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: '.*-envoy-prom'

        # Karpenter metrics
        - job_name: 'karpenter'
          kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
              - karpenter
          relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: karpenter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-metrics

        # Velero metrics
        - job_name: 'velero'
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - velero
          relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: velero
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: monitoring

        # Falco metrics
        - job_name: 'falco'
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - falco
          relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: falco

        # ArgoCD metrics
        - job_name: 'argocd-metrics'
          kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
              - argocd
          relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: 'argocd-.*-metrics'

        # Gatekeeper metrics
        - job_name: 'gatekeeper'
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - gatekeeper-system
          relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: gatekeeper

        # AWS VPC CNI metrics
        - job_name: 'aws-vpc-cni'
          kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - kube-system
          relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: aws-node
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics

  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'cluster', 'service']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        receiver: 'null'
        routes:
        - match:
            alertname: Watchdog
          receiver: 'null'
        - match:
            severity: critical
          receiver: 'null'
          continue: true
        - match:
            severity: warning
          receiver: 'null'
          continue: true
      receivers:
      - name: 'null'

  # Add placeholders for consistency
  clusterName: "" # Set by ArgoCD
  awsRegion: "" # Set by ArgoCD

