kube-prometheus-stack:
  grafana:
    admin:
      existingSecret: grafana-admin-secret
      # The key in the secret that contains the admin password
      passwordKey: GF_SECURITY_ADMIN_PASSWORD
    sidecar:
      secrets:
        enabled: true
    ingress:
      enabled: false
    grafana.ini:
      server:
        domain: localhost
        root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
        serve_from_sub_path: true
    additionalDataSources:
      - name: Loki
        type: loki
        isDefault: false
        editable: true
        access: proxy
        url: "" # Set by ArgoCD
        jsonData:
          timeout: 60
          maxLines: 1000
        version: 1
      - name: Mimir
        type: prometheus
        isDefault: false
        editable: true
        access: proxy
        url: "" # Set by ArgoCD
        jsonData:
          timeout: 60
        version: 1
    # CSI Driver related configuration
    extraVolumes:
      - name: grafana-admin-secret-volume
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: grafana-admin-secret-provider
    extraVolumeMounts:
      - name: grafana-admin-secret-volume
        mountPath: "/mnt/secrets-store"
        readOnly: true
  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: "" # Set by ArgoCD
      externalLabels:
        cluster: "" # Set by ArgoCD
      nodeSelector: {}
      affinity: {}
  alertmanager:
    enabled: true

  # Add placeholders for consistency
  clusterName: "" # Set by ArgoCD
  awsRegion: "" # Set by ArgoCD

