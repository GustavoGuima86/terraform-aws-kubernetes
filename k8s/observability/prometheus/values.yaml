kube-prometheus-stack:
  grafana:
    replicas: 1
    ingress:
      enabled: false
    additionalDataSources:
      - name: Loki
        type: loki
        isDefault: false
        editable: true
        access: proxy
        url: "" # Set by ArgoCD
        jsonData:
          timeout: 60
          maxLines: 1000
        version: 1
      - name: Mimir
        type: prometheus
        isDefault: false
        editable: true
        access: proxy
        url: "" # Set by ArgoCD
        jsonData:
          timeout: 60
        version: 1
  prometheus:
    prometheusSpec:
      remoteWrite:
        - url: "" # Set by ArgoCD
      externalLabels:
        cluster: "" # Set by ArgoCD
      nodeSelector: {}
      affinity: {}
  alertmanager:
    enabled: true

  # Add placeholders for consistency
  clusterName: "" # Set by ArgoCD
  awsRegion: "" # Set by ArgoCD

