apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-servicemonitors
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: {{ .Release.Name }}
data:
  README.md: |
    # ServiceMonitor Configurations

    This ConfigMap documents the ServiceMonitor resources that should be created
    by each service's Helm chart. The Prometheus Operator will automatically
    discover and scrape these endpoints.

    ## Required ServiceMonitors

    ### Istio
    - Created by: Istio Helm chart
    - Namespace: istio-system
    - Metrics endpoints:
      - istiod:15014/metrics (control plane)
      - *.istio-system.svc:15090/stats/prometheus (sidecars)

    ### Karpenter
    - Created by: Karpenter Helm chart
    - Namespace: karpenter
    - Metrics endpoint: karpenter:8000/metrics
    - Labels: app.kubernetes.io/name=karpenter

    ### ArgoCD
    - Created by: ArgoCD Helm chart
    - Namespace: argocd
    - Metrics endpoints:
      - argocd-server-metrics:8083/metrics
      - argocd-repo-server-metrics:8084/metrics
      - argocd-controller-metrics:8082/metrics
      - argocd-applicationset-controller-metrics:8080/metrics

    ### Velero
    - Created by: Velero Helm chart
    - Namespace: velero
    - Metrics endpoint: velero:8085/metrics
    - Labels: app.kubernetes.io/name=velero

    ### Falco
    - Created by: Falco Helm chart
    - Namespace: falco
    - Metrics endpoint: falco:8765/metrics
    - Labels: app.kubernetes.io/name=falco

    ### Gatekeeper
    - Created by: Gatekeeper Helm chart
    - Namespace: gatekeeper-system
    - Metrics endpoint: gatekeeper-controller-manager:8888/metrics
    - Labels: app=gatekeeper

    ### AWS VPC CNI
    - Requires manual ServiceMonitor (see below)
    - Namespace: kube-system
    - Metrics endpoint: aws-node:61678/metrics
    - Labels: k8s-app=aws-node

    ## Verification

    Check if ServiceMonitors exist:
    ```bash
    kubectl get servicemonitor -A
    ```

    Verify Prometheus is scraping:
    ```bash
    kubectl port-forward -n observability svc/kube-prometheus-stack-prometheus 9090:9090
    # Visit http://localhost:9090/targets
    ```

