apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatekeeper-alerts
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: {{ .Release.Name }}
spec:
  groups:
  - name: gatekeeper
    interval: 30s
    rules:
    # Gatekeeper Availability Alerts
    - alert: GatekeeperDown
      expr: |
        up{job="gatekeeper"} == 0
      for: 5m
      labels:
        severity: critical
        component: gatekeeper
      annotations:
        summary: "Gatekeeper is down"
        description: "Gatekeeper has been down for more than 5 minutes in cluster {{ .Values.clusterName }}."

    - alert: GatekeeperHighDenyRate
      expr: |
        rate(gatekeeper_validation_request_count{admission_status="deny"}[5m]) > 1
      for: 10m
      labels:
        severity: warning
        component: gatekeeper
      annotations:
        summary: "High rate of Gatekeeper denials"
        description: "Gatekeeper is denying {{ `{{` }} $value {{ `}}` }} requests/s, policy violations detected."

    - alert: GatekeeperWebhookTimeout
      expr: |
        rate(gatekeeper_validation_request_duration_seconds_count{admission_status="timeout"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
        component: gatekeeper
      annotations:
        summary: "Gatekeeper webhook timeouts"
        description: "Gatekeeper webhook is timing out on validation requests."

    - alert: GatekeeperHighValidationLatency
      expr: |
        histogram_quantile(0.95,
          sum(rate(gatekeeper_validation_request_duration_seconds_bucket[5m])) by (le)
        ) > 1
      for: 10m
      labels:
        severity: warning
        component: gatekeeper
      annotations:
        summary: "High Gatekeeper validation latency"
        description: "Gatekeeper P95 validation latency is > 1s."

    - alert: GatekeeperConstraintNotSynced
      expr: |
        gatekeeper_constraint_template_ingestion_count{status="error"} > 0
      for: 5m
      labels:
        severity: warning
        component: gatekeeper
      annotations:
        summary: "Gatekeeper constraint not synced"
        description: "Gatekeeper constraint template {{ `{{` }} $labels.constraint_template {{ `}}` }} has ingestion errors."

    - alert: GatekeeperMutationFailed
      expr: |
        rate(gatekeeper_mutation_request_count{admission_status="error"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
        component: gatekeeper
      annotations:
        summary: "Gatekeeper mutation failures"
        description: "Gatekeeper is failing to apply mutations."

    - alert: GatekeeperAuditViolations
      expr: |
        gatekeeper_violations{enforcement_action="deny"} > 0
      for: 30m
      labels:
        severity: info
        component: gatekeeper
      annotations:
        summary: "Gatekeeper audit violations detected"
        description: "{{ `{{` }} $value {{ `}}` }} violations detected for constraint {{ `{{` }} $labels.constraint_name {{ `}}` }}."

    - alert: GatekeeperCertificateExpiringSoon
      expr: |
        certmanager_certificate_expiration_timestamp_seconds{name=~"gatekeeper.*"} - time() < 604800
      for: 1h
      labels:
        severity: warning
        component: gatekeeper
      annotations:
        summary: "Gatekeeper certificate expiring soon"
        description: "Gatekeeper certificate {{ `{{` }} $labels.name {{ `}}` }} expires in less than 7 days."

