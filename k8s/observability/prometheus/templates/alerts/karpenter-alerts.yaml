apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: karpenter-alerts
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: {{ .Release.Name }}
spec:
  groups:
  - name: karpenter
    interval: 30s
    rules:
    # Karpenter Availability Alerts
    - alert: KarpenterDown
      expr: |
        up{job="karpenter"} == 0
      for: 5m
      labels:
        severity: critical
        component: karpenter
      annotations:
        summary: "Karpenter controller is down"
        description: "Karpenter controller has been down for more than 5 minutes in cluster {{ .Values.clusterName }}."

    - alert: KarpenterHighPodUnschedulableRate
      expr: |
        rate(karpenter_pods_state{state="unschedulable"}[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        component: karpenter
      annotations:
        summary: "High rate of unschedulable pods"
        description: "Karpenter is detecting a high rate of unschedulable pods in cluster {{ .Values.clusterName }}."

    - alert: KarpenterNodeCreationFailed
      expr: |
        rate(karpenter_nodes_created{reason="failed"}[10m]) > 0
      for: 10m
      labels:
        severity: warning
        component: karpenter
      annotations:
        summary: "Karpenter node creation failures"
        description: "Karpenter is failing to create nodes in cluster {{ .Values.clusterName }}."

    - alert: KarpenterInterruptionQueueDepth
      expr: |
        karpenter_interruption_queue_depth > 10
      for: 5m
      labels:
        severity: warning
        component: karpenter
      annotations:
        summary: "High interruption queue depth"
        description: "Karpenter interruption queue has {{ `{{` }} $value {{ `}}` }} messages pending."

    - alert: KarpenterNodeClaimStuckProvisioning
      expr: |
        karpenter_nodeclaims_created - karpenter_nodeclaims_registered > 0
      for: 15m
      labels:
        severity: warning
        component: karpenter
      annotations:
        summary: "NodeClaims stuck in provisioning"
        description: "{{ `{{` }} $value {{ `}}` }} NodeClaims have been provisioning for more than 15 minutes."

    - alert: KarpenterHighDisruptionRate
      expr: |
        rate(karpenter_nodes_terminated[10m]) > 0.5
      for: 10m
      labels:
        severity: warning
        component: karpenter
      annotations:
        summary: "High node disruption rate"
        description: "Karpenter is terminating nodes at a high rate in cluster {{ .Values.clusterName }}."

    - alert: KarpenterCloudProviderErrors
      expr: |
        rate(karpenter_cloudprovider_errors_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        component: karpenter
      annotations:
        summary: "Karpenter cloud provider errors"
        description: "Karpenter is experiencing cloud provider API errors."

