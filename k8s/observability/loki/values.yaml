# ==============================================================================
# Loki Configuration
# ==============================================================================

loki:
  loki:
    auth_enabled: false
    schemaConfig:
      configs:
        - from: 2024-04-01
          object_store: s3
          store: tsdb
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
       aws:
         region: "" # From Terraform
         bucketnames: "" # From Terraform
         s3forcepathstyle: false
    ingester:
       chunk_encoding: snappy
    pattern_ingester:
       enabled: true

    storage:
        type: s3
        bucketNames:
          chunks: "" # From Terraform
          ruler: "" # From Terraform
        s3:
          region: "" # From Terraform

  serviceAccount:
    create: true
    name: "" # From Terraform

  deploymentMode: SingleBinary

  singleBinary:
    replicas: 2

  # Zero out replica counts of other deployment modes
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0

  # Enable gateway for log ingestion
  gateway:
    enabled: true
    replicas: 1
