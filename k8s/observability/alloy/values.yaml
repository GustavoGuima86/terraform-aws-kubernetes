# values.yaml for the alloy wrapper chart
fullnameOverride: "alloy"

alloy:
  alloy:
    # Mount the host's log directories for log collection
    mounts:
      varlog: true  # Mounts /var/log from host
      dockercontainers: true  # Mounts /var/lib/docker/containers (for Docker runtime)

    # Set HOSTNAME environment variable from spec.nodeName for node filtering
    extraEnv:
      - name: HOSTNAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: CLUSTER_NAME
        value: ""  # Overridden by ArgoCD parameter alloy.alloy.extraEnv[1].value

    # Alloy River configuration
    configMap:
      create: true
      content: |
        // Discover all pods in the cluster
        discovery.kubernetes "pods" {
          role = "pod"
        }

        // Add labels to discovered pods and filter to only this node
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          // Only keep pods running on the same node as this Alloy instance
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            action        = "keep"
            regex         = sys.env("HOSTNAME")
          }

          // Set the __path__ label which is REQUIRED for loki.source.kubernetes
          // This tells Alloy where to find the log files
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/$1_$2_$3/$4/*.log"
          }

          // Add namespace label
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          // Add pod label
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          // Add container label
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          // Add node label
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }

          // Add job label
          rule {
            replacement   = "integrations/kubernetes/pod-logs"
            target_label  = "job"
          }
        }

        // Collect logs from discovered pods
        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]
        }

        // Process logs to add additional labels
        loki.process "pod_logs" {
          forward_to = [loki.write.default.receiver]

          stage.static_labels {
            values = {
              cluster = sys.env("CLUSTER_NAME"),
            }
          }
        }

        // Write logs to Loki
        loki.write "default" {
          endpoint {
            url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
          }
          external_labels = {}
        }

  controller:
    type: "daemonset"

  serviceAccount:
    create: true

  rbac:
    create: true

  # Tolerations to run on all nodes including managed nodes
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      effect: "NoSchedule"

