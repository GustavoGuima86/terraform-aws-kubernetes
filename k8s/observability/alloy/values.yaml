# values.yaml for the alloy wrapper chart
fullnameOverride: "alloy"

alloy:
  controller:
    type: "daemonset"

  serviceAccount:
    create: true

  rbac:
    create: true

  configMap:
    content: |
      // Discover all pods in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Filter to only scrape logs from pods on the same node
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Keep only pods on the same node as this alloy instance
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "keep"
          regex         = env("HOSTNAME")
        }

        // Add namespace label
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // Add pod label
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // Add container label
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Add node label
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        // Add job label
        rule {
          replacement   = "integrations/kubernetes/pod-logs"
          target_label  = "job"
        }
      }

      // Collect logs from discovered pods
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Process logs to add additional labels
      loki.process "pod_logs" {
        forward_to = [loki.write.default.receiver]

        stage.static_labels {
          values = {
            cluster = "eks-cluster",
          }
        }
      }

      // Write logs to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
        external_labels = {}
      }

