apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karpenter-network-policy
  namespace: karpenter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: karpenter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow webhook calls from Kubernetes API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 8443
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow access to Kubernetes API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
    
    # Allow HTTPS egress for AWS APIs (EC2, SQS, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
