# Karpenter Helm Values
# Note: Cluster-specific values will be injected by Terraform and ArgoCD

serviceAccount:
  create: true
  name: karpenter
  namespace: karpenter
  annotations: {}

serviceMonitor:
  enabled: true
  additionalLabels: {}
  endpointConfig:
    port: http-metrics

podAnnotations:
  eks.amazonaws.com/aws-sqs-queue-name: "" # Set by ArgoCD

karpenter:
  nodeSelector:
    karpenter.sh/controller: "true"
  defaultNodeRole: "" # Set by ArgoCD
  settings:
    clusterEndpoint: "" # Set by ArgoCD
    clusterName: "" # Set by ArgoCD
    interruptionQueue: "" # Set by ArgoCD
    awsRegion: "" # Set by ArgoCD
  webhook:
    enabled: false

nodepools:
  - name: business-apps
    amiAlias: "bottlerocket@latest"
    instanceCategories: ["m"]
    instanceFamilies: ["m3"]
    capacityType: "spot"
    instanceSizes: ["xlarge", "2xlarge"]
    cpuLimits: 150
    memoryLimits: "150Gi"
    labels:
      nodepool: business-apps
  - name: tooling
    amiAlias: "bottlerocket@latest"
    instanceCategories: ["t"]
    instanceFamilies: []
    capacityType: "on-demand"
    instanceSizes: ["large", "xlarge"]
    cpuLimits: 50
    memoryLimits: "50Gi"
    labels:
      nodepool: tooling
  - name: ai-sre
    amiAlias: "bottlerocket@latest"
    instanceCategories: ["g", "t"]
    instanceFamilies: []
    capacityType: "spot"
    instanceSizes: ["xlarge", "2xlarge", "4xlarge"]
    cpuLimits: 100
    memoryLimits: "100Gi"
    labels:
      nodepool: ai-sre
